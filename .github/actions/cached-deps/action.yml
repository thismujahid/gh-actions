name: "Fet & Cache Dependence"
description: "Get the dependence (via npm) and cache them."
inputs:
  caching:
    description: "Whether to enable caching or not"
    required: false
    default: "true"
outputs:
  used-cache: "Where the cache user."
  value: ${{steps.install.outputs.cache}}
runs:
  using: "composite"
  steps:
    - name: Cache dependencies
      if: inputs.caching == 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true' || inputs.caching != 'true'
      id: install
      run: |
        npm ci
        echo "::set-output name=cache::'${{inputs.caching}}'"
      shell: bash
