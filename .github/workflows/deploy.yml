name: Deployment
on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Load & cache dependencies
        id: caching-step
        uses: ./.github/actions/cached-deps
      - name: Lint code
        run: |
          npm run lint
          echo "Cache used? ${{steps.caching-step.outputs.used-cache}}"
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Load & cache dependencies
        uses: ./.github/actions/cached-deps
        id: caching-step
      - name: Test code
        id: run-tests
        run: |
          npm run test
          echo "Cache used? ${{steps.caching-step.outputs.used-cache}}"
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Load & cache dependencies
        uses: ./.github/actions/cached-deps
        id: caching-step
      - name: Build website
        run: |
          npm run build
          echo "Cache used? ${{steps.caching-step.outputs.used-cache}}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Get build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-files
          path: ./dist
      - name: Output contents
        run: ls
      - name: Deploy site
        run: echo "Deploying..."
  information:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Run Custom JS Action
        uses: ./.github/actions/deploy-s3
